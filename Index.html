<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  height: 100vh;
  background: #020617;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: "Segoe UI", Arial, sans-serif;
  color: white;
}

.login-box {
  background: #0f172a;
  padding: 40px 48px;
  border-radius: 14px;
  width: 320px;
  box-shadow: 0 0 40px rgba(0,0,0,0.6);
  text-align: center;
}

.login-box h2 {
  margin-bottom: 28px;
  font-weight: 600;
}

.field {
  margin-bottom: 18px;
  text-align: left;
}

.field label {
  font-size: 13px;
  color: #cbd5f5;
  margin-bottom: 6px;
  display: block;
}

.field input {
  width: 100%;
  padding: 10px 12px;
  border-radius: 8px;
  border: none;
  outline: none;
  font-size: 14px;
  background: #020617;
  color: white;
}

.field input::placeholder {
  color: #64748b;
}

button {
  width: 100%;
  margin-top: 10px;
  padding: 10px;
  background: #0ea5e9;
  border: none;
  border-radius: 8px;
  font-size: 15px;
  font-weight: 600;
  color: white;
  cursor: pointer;
}

button:hover {
  background: #0284c7;
}

.forgot {
  margin-top: 14px;
  font-size: 13px;
}

.forgot a {
  color: #38bdf8;
  text-decoration: none;
}

.forgot a:hover {
  text-decoration: underline;
}
</style>
</head>
<body>

<div class="login-box">
  <h2>Login</h2>

  <form id="loginForm">
    <div class="field">
      <label for="username">U</label>
      <input type="text" id="username" placeholder="Username" required autofocus>
    </div>

    <div class="field">
      <label for="password">I</label>
      <input type="password" id="password" placeholder="Password" required>
    </div>

    <button type="submit">Enter</button>
  </form>

  <div class="forgot">
    <a href="#" id="forgotLink">Forgot password?</a>
  </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {

  const form = document.getElementById("loginForm");
  const forgotLink = document.getElementById("forgotLink");

  if (localStorage.getItem("loggedIn") === "true") {
    window.location.href = "viewer.html";
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();

    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value.trim();

    if (!username || !password) {
      alert("Please enter username and password");
      return;
    }

    if (username === "admin" && password === "1234") {
      localStorage.setItem("loggedIn", "true");
      localStorage.setItem("user", username);
      window.location.href = "viewer.html";
    } else {
      alert("Invalid username or password");
    }
  });

  forgotLink.addEventListener("click", function (e) {
    e.preventDefault();
    alert("Please contact administrator to reset your password.");
  });

});
</script>

</body>
</html>
